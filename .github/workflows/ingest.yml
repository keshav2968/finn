name: ingest

on:
  # The weekday schedule is paused while the submission is under review, so the demo shows
  # the snapshot that was tested (14 Nov 2026). To turn it back on, uncomment these lines:
  # 11:35 UTC = 17:05 IST, after the NSE close and the evening results rush.
  # schedule:
  #   - cron: "35 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  build-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Keeps screener.in pages between runs so a re-run within the TTL doesn't refetch.
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-

      # Exchanges sometimes block cloud IPs. The script keeps the previous seed file
      # for anything that fails and marks it stale in manifest.json, so a partial
      # run still commits; a run where nothing at all succeeded fails the job.
      - name: Build seed snapshot
        run: python scripts/build_seed.py

      # Classify, rank and alert on the fresh snapshot (no network, no LLM).
      - name: Build push feed and alerts
        run: python scripts/build_push.py

      # LLM steps. Add GROQ_API_KEY and GOOGLE_API_KEY as repository secrets; without
      # them these steps still run and the cards fall back to screener.in figures.
      - name: Classify filings the rules could not place
        run: python scripts/classify_pending.py && python scripts/build_push.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        continue-on-error: true

      - name: Build results cards
        run: python scripts/build_results_cards.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        continue-on-error: true

      - name: Build management cards
        run: python scripts/build_management_cards.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        continue-on-error: true

      - name: Commit snapshot
        run: |
          git config user.name "finn-bot"
          git config user.email "finn-bot@users.noreply.github.com"
          git add data/seed
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: seed snapshot $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M IST')"
            git push
          fi

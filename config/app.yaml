# Web app (web/) settings, read at build time. Alert thresholds and tier cut-offs are
# not here: they live in push.yaml and reach the app through data/seed/push/feed.json.

timezone: Asia/Kolkata
schedule_note: "A new snapshot lands on weekdays after 17:05 IST."

inbox:
  windows:
    - {key: 24h, label: 24h, hours: 24}
    - {key: 7d, label: 7d, hours: 168}
    - {key: 30d, label: 30d, hours: 720}
  default_window: 7d
  spark_sessions: 7          # sessions in a price alert's sparkline, ending on the alert day
  # Key figure on a results card in the inbox: YoY change of the first of these metrics
  # whose current-quarter figure passed one of results_checks (see results_cards.json).
  results_metrics:
    standard: [revenue, pat]
    lender: [nii, pat]
  results_checks: [verified, screener]

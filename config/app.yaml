# Web app (web/) settings, read at build time. Alert thresholds and tier cut-offs are
# not here: they live in push.yaml and reach the app through data/seed/push/feed.json.

timezone: Asia/Kolkata
schedule_note: "A new snapshot lands on weekdays after 17:05 IST."

inbox:
  windows:
    - {key: 24h, label: 24h, hours: 24}
    - {key: 7d, label: 7d, hours: 168}
    - {key: 30d, label: 30d, hours: 720}
  default_window: 7d
  spark_sessions: 7          # sessions in a price alert's sparkline, ending on the alert day
  # Key figure on a results card in the inbox: YoY change of the first of these metrics
  # whose current-quarter figure passed one of results_checks (see results_cards.json).
  results_metrics:
    standard: [revenue, pat]
    lender: [nii, pat]
  results_checks: [verified, screener]

# "Ask" buttons in a card's detail sheet. Placeholders: {name}, {symbol}, {metric},
# {change}, {date}, {person}. A category not listed uses `default`. Research (the pull
# side) answers these in a later phase; for now the app shows the question pre-filled.
ask:
  max_questions: 3
  price_alert:
    - "Why did {name} move {change} on {date}?"
    - "Was there a filing or news behind it?"
    - "Is this unusual for {name}?"
  results:
    - "Why did {metric} change {change} year on year?"
    - "What did management say on the earnings call?"
    - "What guidance did {name} give for the rest of the year?"
  management_change:
    - "Who is {person} and what is their track record?"
    - "Has {name} had other senior changes recently?"
    - "What does this mean for {name}'s strategy?"
  fund_raise:
    - "What will {name} use the money for?"
    - "How much dilution does this mean for shareholders?"
    - "How does this change {name}'s balance sheet?"
  default:
    - "What does this mean for {name}?"
    - "Has {name} said anything about this in its annual report?"

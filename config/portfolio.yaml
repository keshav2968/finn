portfolio:
  - HDFCBANK
  - BAJFINANCE
  - FEDERALBNK
  - LT
  - POLYCAB
  - ELECON
  - HINDUNILVR
  - TITAN
  - ETERNAL
  - INFY
  - KPITTECH
  - SUNPHARMA
  - MARKSANS
  - RELIANCE
  - TATACHEM

research:
  - symbol: INFY
    focus: Guided revenue growth and operating margin ranges vs what was delivered.
  - symbol: POLYCAB
    focus: Long-term revenue and margin targets vs delivery; working capital and cash conversion.
  - symbol: KPITTECH
    focus: Revenue and EBITDA margin guidance vs delivery; client concentration from the annual report.
  - symbol: ETERNAL
    focus: Mix shift between food delivery and Blinkit; profitability story on calls vs the numbers.

# FINN universe: the only place tickers live. All code reads companies from here.
#
# companies   every company FINN knows about, stored once
#   symbol        NSE symbol (Yahoo Finance uses SYMBOL.NS, falling back to SYMBOL.BO)
#   name          display name
#   sector        free text, used for grouping in the UI
#   size          large | mid | small. The seed build compares this with screener.in's
#                 market cap and warns on a mismatch (thresholds in settings.yaml)
#   is_lender     true for banks and NBFCs. Their results card shows NII, operating
#                 profit, provisions and PAT instead of EBITDA. The build warns if
#                 screener.in's table layout disagrees.
#   bse_code      optional. BSE scrip code used for filings. The build reads the code
#                 from the company's screener.in page and warns if it differs from this.
#   primary_view  optional, consolidated (default) | standalone. Which screener.in view
#                 the app treats as primary. Both views are always fetched.
#
# portfolio   symbols held in the mock portfolio (push side)
# research    symbols demoed on the pull side, with what each one is meant to show.
#             The research pipeline is generic; "focus" is only demo notes.

companies:
  - symbol: HDFCBANK
    name: HDFC Bank
    sector: Banks
    size: large
    is_lender: true
    bse_code: "500180"
    # Consolidated includes HDFC Life and HDFC ERGO; insurance premiums and claims
    # distort the bank's P&L (screener shows negative "Financing Profit").
    primary_view: standalone

  - symbol: BAJFINANCE
    name: Bajaj Finance
    sector: NBFC
    size: large
    is_lender: true
    bse_code: "500034"

  - symbol: FEDERALBNK
    name: Federal Bank
    sector: Banks
    size: mid
    is_lender: true
    bse_code: "500469"
    # Banks are analysed on standalone numbers; NPA ratios are standalone only.
    primary_view: standalone

  - symbol: LT
